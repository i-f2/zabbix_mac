# 通用模板

# 监控项
items:
  # CPU 监控项
  system.cpu.intr:
    name: "Interrupts per second"
    type: 0
    value_type: 0
    delay: "1m"
  
  system.cpu.load[all,avg1]:
    name: "Load average (1m avg)"
    type: 0
    value_type: 0
    delay: "1m"
  
  system.cpu.load[all,avg15]:
    name: "Load average (15m avg)"
    type: 0
    value_type: 0
    delay: "1m"
  
  system.cpu.load[all,avg5]:
    name: "Load average (5m avg)"
    type: 0
    value_type: 0
    delay: "1m"
  
  system.cpu.num:
    name: "Number of CPUs"
    type: 0
    value_type: 3
    delay: "1m"
  
  system.cpu.switches:
    name: "Context switches per second"
    type: 0
    value_type: 0
    delay: "1m"
  
  system.cpu.util:
    name: "CPU utilization"
    type: 0
    value_type: 0
    delay: "1m"
  
  system.cpu.util[,guest_nice]:
    name: "CPU guest nice time"
    type: 0
    value_type: 0
    delay: "1m"
  
  system.cpu.util[,guest]:
    name: "CPU guest time"
    type: 0
    value_type: 0
    delay: "1m"
  
  system.cpu.util[,idle]:
    name: "CPU idle time"
    type: 0
    value_type: 0
    delay: "1m"
  
  system.cpu.util[,interrupt]:
    name: "CPU interrupt time"
    type: 0
    value_type: 0
    delay: "1m"
  
  system.cpu.util[,iowait]:
    name: "CPU iowait time"
    type: 0
    value_type: 0
    delay: "1m"
  
  system.cpu.util[,nice]:
    name: "CPU nice time"
    type: 0
    value_type: 0
    delay: "1m"
  
  system.cpu.util[,softirq]:
    name: "CPU softirq time"
    type: 0
    value_type: 0
    delay: "1m"
  
  system.cpu.util[,steal]:
    name: "CPU steal time"
    type: 0
    value_type: 0
    delay: "1m"
  
  system.cpu.util[,system]:
    name: "CPU system time"
    type: 0
    value_type: 0
    delay: "1m"
  
  system.cpu.util[,user]:
    name: "CPU user time"
    type: 0
    value_type: 0
    delay: "1m"
  
  # 通用监控项
  kernel.maxfiles:
    name: "Maximum number of open file descriptors"
    type: 0
    value_type: 3
    delay: "1h"
  
  kernel.maxproc:
    name: "Maximum number of processes"
    type: 0
    value_type: 3
    delay: "1h"
  
  proc.num:
    name: "Number of processes"
    type: 0
    value_type: 3
    delay: "1m"
  
  proc.num[,,run]:
    name: "Number of running processes"
    type: 0
    value_type: 3
    delay: "1m"
  
  system.boottime:
    name: "System boot time"
    type: 0
    value_type: 3
    delay: "15m"
  
  system.hostname:
    name: "System name"
    type: 0
    value_type: 4
    delay: "1h"
  
  system.localtime:
    name: "System local time"
    type: 0
    value_type: 3
    delay: "1m"

# 触发器
triggers:
  # CPU 触发器
  "High CPU utilization (over {$CPU.UTIL.CRIT}% for 5m)":
    expression: "{host:system.cpu.util.last()}>90"
    priority: 3
  
  # 通用触发器
  "Configured max number of open filedescriptors is too low (< {$KERNEL.MAXFILES.MIN})":
    expression: "{host:kernel.maxfiles.last()}<100000"
    priority: 1
  
  "Configured max number of processes is too low (< {$KERNEL.MAXPROC.MIN})":
    expression: "{host:kernel.maxproc.last()}<10000"
    priority: 1
  
  "System name has changed (new name: {ITEM.VALUE})":
    expression: "{host:system.hostname.diff()}=1 and {host:system.hostname.strlen()}>0"
    priority: 1

# 自动发现规则
discovery_rules:
  # 块设备发现
  - name: "Block devices discovery"
    key: "vfs.dev.discovery"
    delay: "1h"
    filter:
      evaltype: 0
      conditions:
        - macro: "{#DEVTYPE}"
          value: "disk"
        - macro: "{#DEVNAME}"
          value: ".+"
        - macro: "{#DEVNAME}"
          value: "^(loop[0-9]*|sd[a-z][0-9]+|nbd[0-9]+|sr[0-9]+|fd[0-9]+|dm-[0-9]+|ram[0-9]+|ploop[a-z0-9]+|md[0-9]*|hcp[0-9]*|zram[0-9]*)$"
          operator: "NOT_MATCHES_REGEX"
    item_prototypes:
      - name: "{#DEVNAME}: Disk average queue size (avgqu-sz)"
        key: "vfs.dev.queue_size[{#DEVNAME}]"
        value_type: 0
        delay: "0"
      
      - name: "{#DEVNAME}: Disk read request avg waiting time (r_await)"
        key: "vfs.dev.read.await[{#DEVNAME}]"
        value_type: 0
        delay: "1m"
      
      - name: "{#DEVNAME}: Disk read rate"
        key: "vfs.dev.read.rate[{#DEVNAME}]"
        value_type: 0
        delay: "0"
      
      - name: "{#DEVNAME}: Disk read time (rate)"
        key: "vfs.dev.read.time.rate[{#DEVNAME}]"
        value_type: 0
        delay: "0"
      
      - name: "{#DEVNAME}: Disk utilization"
        key: "vfs.dev.util[{#DEVNAME}]"
        value_type: 0
        delay: "0"
      
      - name: "{#DEVNAME}: Disk write request avg waiting time (w_await)"
        key: "vfs.dev.write.await[{#DEVNAME}]"
        value_type: 0
        delay: "1m"
      
      - name: "{#DEVNAME}: Disk write rate"
        key: "vfs.dev.write.rate[{#DEVNAME}]"
        value_type: 0
        delay: "0"
      
      - name: "{#DEVNAME}: Disk write time (rate)"
        key: "vfs.dev.write.time.rate[{#DEVNAME}]"
        value_type: 0
        delay: "0"
      
      - name: "{#DEVNAME}: Get stats"
        key: "vfs.file.contents[/sys/block/{#DEVNAME}/stat]"
        value_type: 4
        delay: "1m"
    trigger_prototypes:
      - description: '{#DEVNAME}: Disk read/write request responses are too high (read > {$VFS.DEV.READ.AWAIT.WARN:"{#DEVNAME}"} ms for 15m or write > {$VFS.DEV.WRITE.AWAIT.WARN:"{#DEVNAME}"} ms for 15m)'
        expression: "min(15m)>20 or min(15m)>20"
        priority: 3

  # 文件系统发现
  - name: "Mounted filesystem discovery"
    key: "vfs.fs.discovery"
    delay: "1h"
    filter:
      evaltype: 0
      conditions:
        - macro: "{#FSTYPE}"
          value: "^(btrfs|ext2|ext3|ext4|reiser|xfs|ffs|ufs|jfs|jfs2|vxfs|hfs|apfs|refs|ntfs|fat32|zfs)$"
        - macro: "{#FSTYPE}"
          value: '^\s$'
          operator: "NOT_MATCHES_REGEX"
        - macro: "{#FSNAME}"
          value: ".+"
        - macro: "{#FSNAME}"
          value: "^(/dev|/sys|/run|/proc|.+/shm$)"
          operator: "NOT_MATCHES_REGEX"
    item_prototypes:
      - name: "{#FSNAME}: Free inodes in %"
        key: "vfs.fs.inode[{#FSNAME},pfree]"
        value_type: 0
        delay: "1m"
    trigger_prototypes:
      - description: '{#FSNAME}: Running out of free inodes (free < {$VFS.FS.INODE.PFREE.MIN.CRIT:"{#FSNAME}"}%)'
        expression: "min(5m)<10"
        priority: 3
      - description: '{#FSNAME}: Running out of free inodes (free < {$VFS.FS.INODE.PFREE.MIN.WARN:"{#FSNAME}"}%)'
        expression: "min(5m)<20"
        priority: 2
      
      - name: "{#FSNAME}: Space utilization"
        key: "vfs.fs.size[{#FSNAME},pused]"
        value_type: 0
        delay: "1m"
      
      - name: "{#FSNAME}: Total space"
        key: "vfs.fs.size[{#FSNAME},total]"
        value_type: 3
        delay: "1m"
      
      - name: "{#FSNAME}: Used space"
        key: "vfs.fs.size[{#FSNAME},used]"
        value_type: 3
        delay: "1m"
    trigger_prototypes:
      - description: '{#FSNAME}: Disk space is critically low (used > {$VFS.FS.PUSED.MAX.CRIT:"{#FSNAME}"}%)'
        expression: "last()>90"
        priority: 3
      - description: '{#FSNAME}: Disk space is low (used > {$VFS.FS.PUSED.MAX.WARN:"{#FSNAME}"}%)'
        expression: "last()>80"
        priority: 2

<!-- 同步/初始化进度弹窗（6 个复核页面 + 资产主机管理共用）
     由 ReviewSyncPoller (static/js/review_common.js) 驱动 -->
<div class="modal fade" id="syncProgressModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="syncProgressTitle">同步进度</h5>
      </div>
      <div class="modal-body">
        <div class="progress sync-progress mb-3">
          <div class="progress-bar progress-bar-striped progress-bar-animated" id="syncProgressBar" style="width: 0%">0%</div>
        </div>
        <p id="syncProgressText" class="mb-2">准备中...</p>
        <div id="syncWarnList" class="text-warning small"></div>
        <div id="syncErrorList" class="text-danger small"></div>
        <div class="mt-3 text-end">
          <button class="btn btn-danger btn-sm" id="stopSyncBtn" onclick="ReviewSyncPoller.stop()">
            <i class="bi bi-stop-circle"></i> 停止同步
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

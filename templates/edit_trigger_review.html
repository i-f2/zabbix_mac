{% extends 'base.html' %}

{% block page_title %}编辑触发器复核记录{% endblock %}

{% block content %}
<div class="form-card">
    <form method="post">
        <div class="mb-3">
            <label for="host_ip" class="form-label">主机 IP</label>
            <input type="text" class="form-control" id="host_ip" name="host_ip" value="{{ trigger.host_ip }}" required>
        </div>
        <div class="mb-3">
            <label for="name" class="form-label">名称</label>
            <input type="text" class="form-control" id="name" name="name" value="{{ trigger.name }}" required>
        </div>
        <div class="mb-3">
            <label for="expression" class="form-label">表达式</label>
            <input type="text" class="form-control" id="expression" name="expression" value="{{ trigger.expression }}" required>
        </div>
        <div class="mb-3">
            <label for="priority" class="form-label">优先级</label>
            <input type="number" class="form-control" id="priority" name="priority" value="{{ trigger.priority }}" required>
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">描述</label>
            <textarea class="form-control" id="description" name="description" rows="3">{{ trigger.description }}</textarea>
        </div>
        <div class="mb-3">
            <label for="status" class="form-label">状态</label>
            <input type="number" class="form-control" id="status" name="status" value="{{ trigger.status }}">
        </div>
        <div class="mb-3">
            <label for="template_name" class="form-label">模板名称</label>
            <input type="text" class="form-control" id="template_name" name="template_name" value="{{ trigger.template_name }}" required>
        </div>
        <button type="submit" class="btn btn-primary">保存</button>
        <a href="{{ url_for('triggers_review') }}" class="btn btn-secondary">取消</a>
    </form>
</div>
{% endblock %}

{% extends 'base.html' %}

{% block content %}
    <h1>模板管理</h1>
    <div class="mt-4">
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>名称</th>
                    <th>描述</th>
                    <th>创建时间</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                {% for template in templates %}
                <tr>
                    <td>{{ template.id }}</td>
                    <td>{{ template.name }}</td>
                    <td>{{ template.description }}</td>
                    <td>{{ template.created_at }}</td>
                    <td>
                        <a href="{{ url_for('template_detail', template_id=template.id) }}" class="btn btn-sm btn-info">查看</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock %}
